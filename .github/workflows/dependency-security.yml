name: Bun security maintenance
on:
  workflow_dispatch:
  pull_request:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
jobs:
  create-pr:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex-bot-pr-probe-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: codex-bot-pr-probe-4a7ccb57fb85-base
      HEAD: codex-bot-pr-probe-4a7ccb57fb85-head
    steps:
      - name: Create temporary bot PR
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f title='Temporary bot PR event probe' -f head="$HEAD" -f base="$BASE" -f body='Temporary event metadata probe.' --jq '"CREATED_PR=" + (.number|tostring)'