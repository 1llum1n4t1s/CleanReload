name: Bun security maintenance
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
  statuses: write
jobs:
  probe:
    if: startsWith(github.ref, 'refs/heads/codex-merge-probe-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BASE: codex-merge-probe-bfe93243868f-base
      HEAD: codex-merge-probe-bfe93243868f-head
      AUX: codex-merge-probe-bfe93243868f-aux
      CONTEXT: codex-merge-probe-bfe93243868f
    steps:
      - name: Test synchronous merge guards
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          readref() { gh api "repos/$REPO/git/ref/heads/$BASE" --jq .object.sha; }
          prnum() { gh api "repos/$REPO/pulls?state=open&head=${REPO%/*}:$1&base=$BASE" --jq '.[0].number'; }
          merge_attempt() {
            local number="$1" sha="$2" expected="$3" label="$4" before="$5" result status
            result=$(curl -sS -w '\n%{http_code}' -X PUT "${headers[@]}" "$api/pulls/$number/merge" -d "$(jq -nc --arg sha "$sha" '{sha:$sha,merge_method:"merge"}')")
            status=${result##*$'\n'}
            echo "$label HTTP $status"
            [[ "$status" == "$expected" ]] || { echo "Unexpected response: ${result%$'\n'*}"; exit 1; }
            [[ "$(readref)" == "$before" ]] || { echo 'Base unexpectedly changed'; exit 1; }
          }
          P=$(prnum "$HEAD"); A=$(prnum "$AUX")
          [[ "$P" =~ ^[0-9]+$ && "$A" =~ ^[0-9]+$ && "$P" != "$A" ]]
          H=$(gh api "repos/$REPO/pulls/$P" --jq .head.sha)
          AH=$(gh api "repos/$REPO/pulls/$A" --jq .head.sha)
          B=$(readref)
          merge_attempt "$P" "$H" 405 guard_missing "$B"
          [[ "$(gh api "repos/$REPO/pulls/$P" --jq .state)" == open ]]
          for sha in "$H" "$AH"; do
            gh api -X POST "repos/$REPO/statuses/$sha" -f state=success -f context="$CONTEXT" -f description='Temporary merge guard test' >/dev/null
          done
          gh api -X PUT "repos/$REPO/pulls/$A/merge" -f sha="$AH" -f merge_method=merge --jq '.merged' | grep -qx true
          B2=$(readref)
          [[ "$B2" != "$B" ]]
          merge_attempt "$P" "$H" 405 strict_base_advanced "$B2"
          tree=$(gh api "repos/$REPO/git/commits/$H" --jq .tree.sha)
          H2=$(gh api -X POST "repos/$REPO/git/commits" -f message='probe head update [skip ci]' -f tree="$tree" -f "parents[]=$H" --jq .sha)
          gh api -X PATCH "repos/$REPO/git/refs/heads/$HEAD" -f sha="$H2" -F force=false >/dev/null
          merge_attempt "$P" "$H" 409 stale_head_sha "$B2"
          gh api -X PATCH "repos/$REPO/pulls/$P" -f state=closed >/dev/null
          result=$(curl -sS -w '\n%{http_code}' -X PUT "${headers[@]}" "$api/pulls/$P/merge" -d "$(jq -nc --arg sha "$H2" '{sha:$sha,merge_method:"merge"}')")
          status=${result##*$'\n'}
          echo "closed_pr HTTP $status"
          [[ "$status" =~ ^(405|409|422)$ ]]
          [[ "$(readref)" == "$B2" ]]
          echo 'All guard probes passed; base remained unchanged after rejected attempts.'