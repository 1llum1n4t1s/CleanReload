name: Dependabot auto-merge

on:
  workflow_run:
    workflows: ["Dependency validation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # App鍵はこのcontroller専用。owner以外のwrite主体や別の自動merge経路を許さないこと。
    # statusはSHA単位で共有されるため、各repoの共有HEAD・merge経路も有効化前に監査する。
    # ownerはDependabot branch作成からbotのPR openedまでbranchを書換えないこと。
    # 保護の反映をownerが監査してから保護確認時刻を設定する。GitHub時刻だけで即時反映は証明できない。
    name: Dependabot guard (enabled only by repository variable)
    if: >-
      github.repository == '1llum1n4t1s/CleanReload' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPENDABOT_GUARD_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Find an eligible candidate before creating a token
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
          BRANCH_PROTECTED_AFTER: ${{ vars.DEPENDABOT_BRANCH_PROTECTED_AFTER }}
          CONFIGURED: ${{ vars.DEPENDENCY_GUARD_APP_CLIENT_ID != '' && vars.DEPENDENCY_GUARD_APP_ID != '' && vars.DEPENDENCY_GUARD_RULESET_ID != '' && vars.DEPENDENCY_GUARD_RULESET_UPDATED_AT != '' && vars.DEPENDABOT_BRANCH_RULESET_ID != '' && vars.DEPENDABOT_BRANCH_RULESET_UPDATED_AT != '' && vars.DEPENDABOT_BRANCH_PROTECTED_AFTER != '' && secrets.DEPENDENCY_GUARD_PRIVATE_KEY != '' }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { hasGuardCandidate } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/Dependabot-Github.mjs')).href);
            let candidate = false;
            if (process.env.CONFIGURED !== 'true') {
              core.notice('Dependabot guardの設定が未完了のため保留します。');
            } else try {
              candidate = await hasGuardCandidate({ github, owner: context.repo.owner, repo: context.repo.repo,
                workflowSha: context.sha, event: context.eventName, eventHead: process.env.EVENT_HEAD,
                protectedAfter: process.env.BRANCH_PROTECTED_AFTER });
            } catch {
              core.warning('Dependabot候補を確定できないため保留します。');
            }
            core.setOutput('candidate', candidate ? 'true' : 'false');
      - name: Create status-only app token
        if: steps.candidate.outputs.candidate == 'true'
        id: guard-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DEPENDENCY_GUARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_GUARD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: CleanReload
          permission-statuses: write
      - name: Verify Dependabot evidence and reserve auto-merge
        if: steps.candidate.outputs.candidate == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GUARD_APP_ID: ${{ vars.DEPENDENCY_GUARD_APP_ID }}
          GUARD_RULESET_ID: ${{ vars.DEPENDENCY_GUARD_RULESET_ID }}
          GUARD_RULESET_UPDATED_AT: ${{ vars.DEPENDENCY_GUARD_RULESET_UPDATED_AT }}
          BRANCH_RULESET_ID: ${{ vars.DEPENDABOT_BRANCH_RULESET_ID }}
          BRANCH_RULESET_UPDATED_AT: ${{ vars.DEPENDABOT_BRANCH_RULESET_UPDATED_AT }}
          BRANCH_PROTECTED_AFTER: ${{ vars.DEPENDABOT_BRANCH_PROTECTED_AFTER }}
          GUARD_APP_SLUG: ${{ steps.guard-app.outputs.app-slug }}
          GUARD_APP_TOKEN: ${{ steps.guard-app.outputs.token }}
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { runGithubGuard } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/Dependabot-Github.mjs')).href);
            const result = await runGithubGuard({
              github, owner: context.repo.owner, repo: context.repo.repo,
              workflowSha: context.sha, event: context.eventName, eventHead: process.env.EVENT_HEAD,
              appId: Number(process.env.GUARD_APP_ID), appSlug: process.env.GUARD_APP_SLUG,
              appToken: process.env.GUARD_APP_TOKEN, rulesetId: Number(process.env.GUARD_RULESET_ID),
              rulesetUpdatedAt: process.env.GUARD_RULESET_UPDATED_AT,
              branchRulesetId: Number(process.env.BRANCH_RULESET_ID), branchRulesetUpdatedAt: process.env.BRANCH_RULESET_UPDATED_AT,
              protectedAfter: process.env.BRANCH_PROTECTED_AFTER,
              runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            core.info(result);
