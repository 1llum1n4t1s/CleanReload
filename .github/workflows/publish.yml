name: Publish to Chrome Web Store + Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

env:
  RELEASE_SOURCE_SHA: ${{ github.sha }}
  RELEASE_REF_NAME: ${{ github.ref_name }}

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Chrome Web Store 公開
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    env:
      # CI では scripts/generate-icons.js（sharp）しか実行しないので puppeteer の Chromium (~200MB) は不要
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Prepare native Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile 'package.json'

      - name: 依存インストール
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies

      - name: 全 variant の release 入力を固定・照合
        run: bun scripts/verify-release-artifact.mjs source

      - name: package.json バージョンも一致するか確認
        env:
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_ver=$(bun -p "require('./package.json').version")
          if [ "$pkg_ver" != "$MANIFEST_VERSION" ]; then
            echo "::error::package.json ($pkg_ver) と manifest.json ($MANIFEST_VERSION) が不一致"
            exit 1
          fi
          echo "✅ package.json バージョン一致: $pkg_ver"

      - name: アイコン生成
        run: bun scripts/generate-icons.js

      - name: zip パッケージを作成
        run: |
          zip -r clean-reload.zip manifest.json icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh clean-reload.zip

      - name: Chrome Web Store にアップロード & 公開
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          bun scripts/verify-release-artifact.mjs chrome clean-reload.zip > "$RUNNER_TEMP/clean-reload-verified.json"
          CHROME_SHA256=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/clean-reload-verified.json"))["sha256"])')
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "clean-reload.zip" -ExpectedSha256 "$CHROME_SHA256"

  publish-firefox:
    name: Firefox AMO に submission
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    # Chrome publish が失敗（同 version 重複 upload 等）しても Firefox AMO は独立して submit する。
    # cancelled() のときだけ skip。
    if: ${{ success() || failure() }}
    env:
      # CI では generate-icons（sharp）しか実行しないので puppeteer の Chromium DL は不要
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.firefox.json)
          expected="release/${version}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.firefox.json のバージョン ($version) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest.firefox バージョン一致: $expected"

      - name: Prepare native Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile 'package.json'

      - name: 依存インストール
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies

      - name: 全 variant の release 入力を固定・照合
        run: bun scripts/verify-release-artifact.mjs source

      - name: アイコン生成
        run: bun scripts/generate-icons.js

      - name: Firefox 用ソースディレクトリを構築
        # manifest.firefox.json を manifest.json として配置し、icons / src を同梱。
        # CleanReload は _locales を使わない（name / description 直書き）ので _locales のコピーは不要。
        # background は manifest.firefox.json 側で scripts 配列にしてある（Firefox MV3 は service_worker 非対応）。
        run: |
          mkdir -p firefox-build
          cp manifest.firefox.json firefox-build/manifest.json
          cp -r icons firefox-build/
          cp -r src firefox-build/
          find firefox-build \( -name "*.DS_Store" -o -name "*.swp" -o -name "*~" \) -delete
          echo "🦊 firefox-build 構築完了"
          ls -la firefox-build/

      - name: web-ext lint（AMO validator 相当チェック）
        run: bun --bun run web-ext lint --source-dir=firefox-build

      - name: Firefox AMO に HTTP submission
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishAmo.ps1 -WorkDirectory "$RUNNER_TEMP/amo-publisher-tests"
          test ! -e firefox-build/.amo-upload-uuid
          mkdir -p web-ext-artifacts
          ARCHIVE="$GITHUB_WORKSPACE/web-ext-artifacts/unsigned-submission.xpi"
          test ! -e "$ARCHIVE"
          pwsh -NoProfile -File scripts/Test-FirefoxArchive.ps1 -WorkDirectory "$RUNNER_TEMP/firefox-archive-tests"
          pwsh -NoProfile -File scripts/New-FirefoxArchive.ps1 -SourceDirectory firefox-build -Archive "$ARCHIVE" > web-ext-artifacts/build-receipt.json
          VERSION=$(python3 -c 'import json; print(json.load(open("firefox-build/manifest.json"))["version"])')
          ADDON_ID=$(python3 -c 'import json; m=json.load(open("firefox-build/manifest.json")); print(m.get("browser_specific_settings",m.get("applications",{}))["gecko"]["id"])')
          bun scripts/verify-release-artifact.mjs firefox "$ARCHIVE" > web-ext-artifacts/verified.json
          SHA256=$(python3 -c 'import json; print(json.load(open("web-ext-artifacts/verified.json"))["sha256"])')
          pwsh -NoProfile -File scripts/Publish-Amo.ps1 -Archive "$ARCHIVE" -Metadata .amo-metadata.json -AddonId "$ADDON_ID" -ExpectedVersion "$VERSION" -ExpectedSha256 "$SHA256"
