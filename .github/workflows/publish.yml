name: Publish to Chrome Web Store

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store 公開
    runs-on: ubuntu-latest
    env:
      # CI では scripts/generate-icons.js（sharp）しか実行しないので puppeteer の Chromium (~200MB) は不要
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Node セットアップ
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存インストール
        run: npm ci

      - name: package.json バージョンも一致するか確認
        env:
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          if [ "$pkg_ver" != "$MANIFEST_VERSION" ]; then
            echo "::error::package.json ($pkg_ver) と manifest.json ($MANIFEST_VERSION) が不一致"
            exit 1
          fi
          echo "✅ package.json バージョン一致: $pkg_ver"

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: zip パッケージを作成
        run: |
          zip -r clean-reload.zip manifest.json icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh clean-reload.zip

      - name: Chrome Web Store にアップロード & 公開
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          npx chrome-webstore-upload-cli upload \
            --source clean-reload.zip \
            --extension-id "$CWS_EXTENSION_ID" \
            --client-id "$CWS_CLIENT_ID" \
            --client-secret "$CWS_CLIENT_SECRET" \
            --refresh-token "$CWS_REFRESH_TOKEN" \
            --auto-publish
          echo "🎉 Chrome Web Store への公開リクエストを送信したよ〜"
