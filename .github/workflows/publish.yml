name: Publish to Chrome Web Store + Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store 公開
    runs-on: ubuntu-latest
    env:
      # CI では scripts/generate-icons.js（sharp）しか実行しないので puppeteer の Chromium (~200MB) は不要
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 11

      - name: Node セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 依存インストール
        run: pnpm install --frozen-lockfile

      - name: package.json バージョンも一致するか確認
        env:
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          if [ "$pkg_ver" != "$MANIFEST_VERSION" ]; then
            echo "::error::package.json ($pkg_ver) と manifest.json ($MANIFEST_VERSION) が不一致"
            exit 1
          fi
          echo "✅ package.json バージョン一致: $pkg_ver"

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: zip パッケージを作成
        run: |
          zip -r clean-reload.zip manifest.json icons src \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh clean-reload.zip

      - name: Chrome Web Store にアップロード & 公開
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          # 同 version 再 push（release ブランチ再 push 等）では既にアップロード/審査中で
          # cli が exit 1 になる。これは無害な重複なので warning 化して CI を green に保つ。
          # v4 以降はコマンド省略（upload/publish 未指定）で upload+publish が自動実行される。
          set +e
          pnpm exec chrome-webstore-upload \
            --source clean-reload.zip 2>&1 | tee /tmp/cws.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -qiE "ITEM_NOT_UPDATABLE|pending review|ready to publish|cannot be updated|already (published|exists|uploaded)|currently in review|in_review|version already|DUPLICATE_VERSION" /tmp/cws.log; then
              echo "::warning::Chrome Web Store に同 version が既にアップロード/公開済み。CI green 化のため exit 0 扱いに変換します"
            else
              echo "::error::chrome-webstore-upload が同 version 重複以外の理由で失敗しました (rc=$rc)。ログ確認要"
              exit "$rc"
            fi
          fi
          echo "🎉 Chrome Web Store への公開リクエストを送信したよ〜"

  publish-firefox:
    name: Firefox AMO に submission
    runs-on: ubuntu-latest
    # Chrome publish が失敗（同 version 重複 upload 等）しても Firefox AMO は独立して submit する。
    # cancelled() のときだけ skip。
    if: ${{ success() || failure() }}
    env:
      # CI では generate-icons（sharp）しか実行しないので puppeteer の Chromium DL は不要
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.firefox.json)
          expected="release/${version}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.firefox.json のバージョン ($version) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest.firefox バージョン一致: $expected"

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 11

      - name: Node セットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 依存インストール
        run: pnpm install --frozen-lockfile

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: Firefox 用ソースディレクトリを構築
        # manifest.firefox.json を manifest.json として配置し、icons / src を同梱。
        # CleanReload は _locales を使わない（name / description 直書き）ので _locales のコピーは不要。
        # background は manifest.firefox.json 側で scripts 配列にしてある（Firefox MV3 は service_worker 非対応）。
        # web-ext sign は zip ではなく source-dir を受け取り自身で xpi を構築するため source dir のまま渡す。
        run: |
          mkdir -p firefox-build
          cp manifest.firefox.json firefox-build/manifest.json
          cp -r icons firefox-build/
          cp -r src firefox-build/
          find firefox-build \( -name "*.DS_Store" -o -name "*.swp" -o -name "*~" \) -delete
          echo "🦊 firefox-build 構築完了"
          ls -la firefox-build/

      - name: web-ext lint（AMO validator 相当チェック）
        run: pnpm exec web-ext lint --source-dir=firefox-build

      - name: Firefox AMO に submit (web-ext sign --channel=listed)
        # web-ext 10+ では submission API がデフォルト動作。--channel=listed で AMO 公開（人間レビュー入り）。
        # AMO API キー（JWT issuer / secret）は GitHub Secrets:
        #   gh secret set AMO_JWT_ISSUER / gh secret set AMO_JWT_SECRET
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET の GitHub Secrets が未設定です"
            echo "  JWT 発行: https://addons.mozilla.org/ja/developers/addon/api/key/"
            echo "  登録: gh secret set AMO_JWT_ISSUER / gh secret set AMO_JWT_SECRET"
            exit 1
          fi
          # web-ext sign --channel=listed は AMO の auto-sign を待たずに約 15 分で
          # "Approval: timeout exceeded" を返して exit 1 になる既知挙動（submission 自体は受理済み）。
          # timeout / 同 version 重複は warning 化して CI を green に保つ。それ以外の exit 1 は fail。
          set +e
          pnpm exec web-ext sign \
            --source-dir=firefox-build \
            --artifacts-dir=web-ext-artifacts \
            --channel=listed \
            --amo-metadata=.amo-metadata.json 2>&1 | tee /tmp/web-ext.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q "Approval: timeout exceeded" /tmp/web-ext.log; then
              echo "::warning::web-ext sign が timeout exceeded で exit 1 を返したが submission は AMO に受理済み。CI green 化のため exit 0 扱いに変換します"
            elif grep -qiE "already exists|conflict" /tmp/web-ext.log; then
              echo "::warning::AMO に既に同 version が存在するため version conflict で fail。CI green 化のため exit 0 扱いに変換します"
            else
              echo "::error::web-ext sign が timeout exceeded / version conflict 以外の理由で失敗しました (rc=$rc)。ログ確認要"
              exit "$rc"
            fi
          fi
          echo "🦊 Firefox AMO への submission 送信完了（レビュー待ち）"
          echo "🔗 AMO Developer Hub: https://addons.mozilla.org/developers/"
          echo "⏰ レビュー結果は通常 1〜数日でメール通知"
